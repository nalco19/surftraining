<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surf Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ocean:#0a3d5c;--wave:#1a7fa0;--kelp:#2d6a4f;--sun:#f4a261;--purple:#7f5af0;--text:#1a2332;--muted:#6b7a8d;--bg:#f0f4f8}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app-header{background:var(--ocean);padding:1.25rem 1.5rem 1rem;position:relative;overflow:hidden}
.app-header::before{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;background:var(--wave);border-radius:50%;opacity:.25}
.app-title{font-family:'DM Serif Display',serif;font-size:22px;color:#fff;position:relative}
.app-sub{font-size:11px;color:rgba(255,255,255,.55);letter-spacing:.08em;text-transform:uppercase;margin-top:3px;position:relative}
.day-tabs{display:flex;gap:4px;padding:.75rem 1rem;background:var(--ocean);overflow-x:auto;position:sticky;top:0;z-index:10;scrollbar-width:none}
.day-tabs::-webkit-scrollbar{display:none}
.dt{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.6);background:transparent;transition:all .2s;font-family:'DM Sans',sans-serif}
.dt:hover{background:rgba(255,255,255,.1)}
.dt.on{background:#fff;color:var(--ocean);border-color:#fff}
.dt.today{border-color:var(--sun);color:var(--sun)}
.dt.today.on{background:var(--sun);color:#fff;border-color:var(--sun)}
.sess{display:none;padding:1rem}
.sess.vis{display:block}
.s-hero{border-radius:16px;padding:1.25rem 1.5rem;margin-bottom:1rem;position:relative;overflow:hidden}
.s-day-tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:5px}
.s-title{font-family:'DM Serif Display',serif;font-size:20px;color:#fff;margin-bottom:.5rem}
.s-chips{display:flex;gap:8px;flex-wrap:wrap}
.s-chip{font-size:10px;padding:3px 10px;border-radius:10px;background:rgba(255,255,255,.15);color:rgba(255,255,255,.85);display:inline-flex;align-items:center;gap:4px}
.prog-wrap{margin-bottom:1rem}
.prog-label{font-size:10px;color:var(--muted);text-align:right;margin-bottom:3px}
.prog-bar{background:#e2e8f0;border-radius:4px;height:5px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;transition:width .4s ease;width:0%}
.block{margin-bottom:.75rem}
.block-hd{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem;padding-bottom:.4rem;border-bottom:1px solid rgba(0,0,0,.07)}
.block-time{margin-left:auto;font-size:10px;color:var(--muted)}
.ex-card{background:#fff;border-radius:14px;margin-bottom:.5rem;overflow:hidden;border:1px solid rgba(0,0,0,.06);transition:all .15s}
.ex-card.done-card{border-color:#2d6a4f;background:#f0faf5}
.ex-inner{display:flex;align-items:stretch}
.ex-img{width:100px;min-height:80px;flex-shrink:0;overflow:hidden;background:#f0f4f8;display:flex;align-items:center;justify-content:center}
.ex-img img{width:100%;height:100%;object-fit:cover;display:block}
.ex-info{padding:10px 12px;flex:1;min-width:0}
.ex-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px;line-height:1.3}
.ex-sets{font-size:10px;background:#e8f7f0;color:#1a5c3a;border-radius:8px;padding:2px 8px;display:inline-block;margin-bottom:4px;font-weight:500}
.ex-cue{font-size:11px;color:var(--muted);line-height:1.45}
.ex-safe{font-size:10px;color:#7a4a0a;background:#fef3e2;border-radius:6px;padding:1px 7px;display:inline-block;margin-top:3px}
.ex-check{width:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;border-left:1px solid rgba(0,0,0,.05)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid #dde2e8;display:flex;align-items:center;justify-content:center;transition:all .2s;background:#fff}
.chk.on{background:#2d6a4f;border-color:#2d6a4f}
.chk svg{opacity:0;transition:opacity .2s}
.chk.on svg{opacity:1}
.tip{background:linear-gradient(135deg,#e8f4f8,#d4eef5);border-left:3px solid var(--wave);border-radius:0 12px 12px 0;padding:10px 14px;font-size:12px;color:#1a5c6a;margin-top:1rem;line-height:1.5}
.tip strong{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;color:var(--wave)}
.done-banner{background:linear-gradient(135deg,var(--kelp),var(--wave));border-radius:14px;padding:1.25rem;text-align:center;margin-top:1rem;display:none}
.done-banner.show{display:block}
.done-banner p{color:#fff;font-family:'DM Serif Display',serif;font-size:18px;margin-bottom:4px}
.done-banner span{color:rgba(255,255,255,.7);font-size:12px}
</style>
</head>
<body>
<div class="app-header">
  <div class="app-title">Surf Training</div>
  <div class="app-sub">Plano semanal · Remada + Core + Yoga</div>
</div>
<div class="day-tabs" id="dayTabs"></div>
<div id="allSessions"></div>
<script src="images.js"></script>
<script>
function e(name,sets,cue,safe,img){return{name,sets,cue,safe:!!safe,img:img||null}}

const DAYS=[
  {id:'seg',short:'2ª',label:'Segunda',sub:'Yoga',color:'#7f5af0',
   chips:["8' aquec.","42' yoga","10' retorno"],
   blocks:[
    {label:'Aquecimento',time:'8 min',exs:[
      e('Cat-cow','2×10 · 3 min','Coluna neutra, lento. Torácica abre no cow.',false,'Cat_cow'),
      e('Rotações de ombro','30 seg cada · 2 min','Círculos amplos e progressivos. Aquece manguito rotador.',false,'Shoulder_CARs'),
    ]},
    {label:'Bloco principal',time:'42 min',exs:[
      e('Downdog → updog','5 ciclos · 5 min','Inspira no updog, expira no downdog. Pausa 3 seg.',false,'Downward_upward_dog_flow'),
      e('Twisted lunge','90 seg cada lado · 6 min','Rota do torso, não do pescoço. Braço aponta para o tecto.',false,'Twisted_lunge'),
      e('Puppy pose','90 seg cada lado · 6 min','Anca sobre joelhos. Peito desce por gravidade.',false,'Puppy_pose'),
      e('Pigeon pose (reclined)','2 min cada lado · 8 min','Pé activo — protege joelho. Reclined elimina carga em L4-L5.',true,'Pigeon_pose'),
      e('Dragon pose','2 min cada lado · 8 min','Psoas profundo. Tronco erecto. Usa bloco se necessário.',false,'Dragon_pose'),
    ]},
    {label:'Retorno à calma',time:'10 min',exs:[
      e('Supine twist','2 min cada lado · 4 min','Ombros no chão, joelhos juntos. Descomprime L4-L5.',true,'Supine_spinal_twist'),
      e('Legs up the wall','5 min','Pernas relaxadas. Recuperação passiva. Parasimpático.',false,'Legs_up_the_wall'),
    ]},
   ],
   tip:'Pede ao professor para incorporar rotação torácica T4-T8 — é o que cria rotação real no surf.'},

  {id:'ter',short:'3ª',label:'Terça',sub:'Circuito ou Remada',color:'#1a7fa0',
   chips:["8' aquec.","42' treino","10' retorno"],
   blocks:[
    {label:'Aquecimento',time:'8 min',exs:[
      e('Cat-cow','2×10 · 3 min','Ativa coluna e mobiliza torácica antes do esforço.',false,'Cat_cow'),
      e("World's greatest stretch",'3 cada lado · 5 min','Anca, torácica e posterior — tudo de uma vez.',false,'Worlds_greatest_stretch'),
    ]},
    {label:'Opção A — Circuito + surf add-ons',time:'42 min',exs:[
      e('Pop-up burpee','3×8 · 5 min','Deita, push-up, salta para posição de surf. Padrão neuromotor.',false,'Pop_up_burpee'),
      e('Circuito habitual','~35 min','Mantém os teus exercícios. Pop-up e Turkish são os únicos add-ons.',false,null),
      e('Turkish get-up (leve)','3×5 cada lado · 8 min','4-6 kg. Lento e controlado. Mobilidade total + estabilidade.',true,'Turkish_get_up'),
    ]},
    {label:'Opção B — Força + Remada',time:'42 min',exs:[
      e('TRX row / Banda elástica','4×12 · 10 min','Retrai escápulas antes de puxar. Cotovelos colados. Pausa 2 seg no topo.',false,'TRX_inverted_row'),
      e('Push-up lento (3 seg descida)','3×10 · 7 min','Corpo rígido. Descida 3 seg, pausa 1 seg em baixo.',false,'Push_up_lento'),
      e('Superman hold','3×10 seg · 6 min','Amplitude PEQUENA. Para imediatamente se sentires lombar.',true,'Superman_hold'),
      e('Bird-dog com pausa 3 seg','3×10 cada lado · 8 min','Lombar neutra. Pausa 3 seg com extensão máxima.',true,'Bird_dog'),
      e('Pallof press','3×12 · 8 min','Tronco NÃO rota. Quanto mais afastado da banda, mais difícil.',true,'Pallof_press_banda'),
    ]},
    {label:'Retorno à calma',time:'10 min',exs:[
      e('Chest stretch na porta','60 seg · 2 min','Cotovelo 90° na ombreira. Roda o corpo para longe.',false,'Shoulder_CARs'),
      e("Child's pose",'90 seg · 3 min','Descomprime lombar. Joelhos afastados se necessário.',true,'Puppy_pose'),
      e('Supine twist','90 seg cada lado · 3 min','Fecha com rotação após treino de força.',true,'Supine_spinal_twist'),
    ]},
   ],
   tip:'Alterna Opção A e B semana a semana. O pop-up burpee é treino neuromotor — o padrão fica automático muito mais depressa.'},

  {id:'qua',short:'4ª',label:'Quarta',sub:'Yoga',color:'#7f5af0',
   chips:["8' aquec.","42' yoga","10' retorno"],
   blocks:[
    {label:'Aquecimento',time:'8 min',exs:[
      e('Cat-cow + respiração','2×10 · 3 min','Foca na extensão torácica no cow — cabeça sobe, peito abre.',false,'Cat_cow'),
      e('90-90 hip switches','2×10 · 5 min','Rota lentamente entre os dois lados. Ativa rotadores de anca.',false,'90_90_hip_switch'),
    ]},
    {label:'Bloco principal',time:'42 min',exs:[
      e('Downdog calcanhares alternados','5 min','Pressiona alternadamente cada calcanhar para o chão.',false,'Downward_upward_dog_flow'),
      e('Lunge com abertura lateral','90 seg cada lado · 6 min','Da posição de lunge, abre braços em cruz — peito e psoas abrem.',false,'Twisted_lunge'),
      e('Dragon pose (foco no psoas)','3 min cada lado · 10 min','Versão mais profunda. Usa blocos. Sem esforço ativo.',false,'Dragon_pose'),
      e('Reclined pigeon','2 min cada lado · 8 min','Versão deitada — elimina carga em L4-L5. Pé ativo.',true,'Pigeon_pose'),
      e('Puppy pose lateral','90 seg cada lado · 6 min','Da puppy, desliza braços para um lado — abre flanco e torácica.',false,'Puppy_pose'),
    ]},
    {label:'Retorno à calma',time:'10 min',exs:[
      e('Reclined spinal twist','2 min cada lado · 4 min','Descomprime L4-L5. Faz todos os dias se puderes.',true,'Supine_spinal_twist'),
      e('Savasana prolongado','6 min','Recuperação do sistema nervoso. Não saltes daqui.',false,'Respiracao_diafragmatica'),
    ]},
   ],
   tip:'Dragon pose abre o psoas — o músculo mais tensionado na stance de surf. É o stretch mais importante do teu plano.'},

  {id:'qui',short:'5ª',label:'Quinta',sub:'Core + Mobilidade',color:'#2d6a4f',
   chips:["10' aquec.","35' core","10' mob.","5' retorno"],
   blocks:[
    {label:'Aquecimento',time:'10 min',exs:[
      e("World's greatest stretch",'3 cada lado · 4 min','O melhor aquecimento de corpo inteiro.',false,'Worlds_greatest_stretch'),
      e('90-90 hip switches','2×10 · 3 min','Tronco erecto durante a rotação.',false,'90_90_hip_switch'),
      e('Ankle circles + calf raises','2 min','10 círculos cada direção. Mobiliza tornozelo para stance.',false,'Ankle_circles_calf_stretch'),
    ]},
    {label:'Core profundo',time:'35 min',exs:[
      e('Dead bug','4×10 · 10 min','Lombar COLADA ao chão SEMPRE. Amplitude pequena. Expira quando extendes braço+perna.',true,'Dead_bug'),
      e('Plank lateral forearm','3×30 seg cada lado · 8 min','Corpo em linha reta. Anca não desce. Reduz se sentires lombar.',true,'Plank_lateral'),
      e('Bird-dog com pausa 3 seg','3×10 cada lado · 8 min','Pausa 3 seg. Lombar neutra — não arqueia um milímetro.',true,'Bird_dog'),
      e('Glute bridge unilateral','3×12 cada lado · 9 min','Joelho ligeiramente fletido — protege. Sobe até linha do tronco.',true,'Glute_bridge_unilateral'),
    ]},
    {label:'Mobilidade',time:'10 min',exs:[
      e('Hip 90-90 + pry squat','2×10 · 5 min','Da posição 90-90, squat profundo com mãos no chão.',false,'90_90_hip_switch'),
      e('Calf stretch na parede','3 min','Tornozelo contra parede, joelho avança. Mede semana a semana.',false,'Ankle_circles_calf_stretch'),
    ]},
    {label:'Retorno à calma',time:'5 min',exs:[
      e('Supine twist','90 seg cada lado','Fecha o treino de core com rotação de coluna.',true,'Supine_spinal_twist'),
    ]},
   ],
   tip:'Dead bug é o exercício-âncora para a hérnia. Lombar sempre colada — nunca arqueia nem um milímetro.'},

  {id:'sex',short:'6ª',label:'Sexta',sub:'Yoga restaurativo',color:'#7f5af0',
   chips:["8' aquec.","42' restaur.","10' retorno"],
   blocks:[
    {label:'Aquecimento suave',time:'8 min',exs:[
      e('Cat-cow lento','2×8 · 3 min','Mais lento do que no início da semana. Escuta o corpo.',false,'Cat_cow'),
      e('Shoulder rolls','3 min','Círculos de ombros lentos. Inclinação lateral suave da cabeça.',false,'Shoulder_CARs'),
    ]},
    {label:'Bloco restaurativo',time:'42 min',exs:[
      e('Puppy pose prolongada','3 min','Versão longa. Peito desce por gravidade. Sem esforço.',false,'Puppy_pose'),
      e('Reclined pigeon bilateral','3 min cada lado · 6 min','Versão mais segura. Anca larga completamente.',true,'Pigeon_pose'),
      e('Shoulder opener na parede','90 seg cada lado · 5 min','Braço a 90° na parede. Rota corpo para longe. Abre peito.',false,'Shoulder_CARs'),
      e('Dragon pose yin (passivo)','3 min cada lado · 10 min','Usa apoios. Sem esforço ativo — peso do corpo trabalha.',false,'Dragon_pose'),
      e('Supta matsyendrasana','3 min cada lado · 8 min','Twist longo e passivo. O melhor para L4-L5.',true,'Supine_spinal_twist'),
    ]},
    {label:'Retorno à calma',time:'10 min',exs:[
      e('Legs up the wall','5 min','Prepara corpo para fim de semana ativo. Parasimpático.',false,'Legs_up_the_wall'),
      e('Savasana + respiração diafragmática','5 min','Mão na barriga sobe primeiro. Expiração longa 6-8 seg.',true,'Respiracao_diafragmatica'),
    ]},
   ],
   tip:'A 6ª suave é melhor preparação para o surf do que qualquer treino intenso. O corpo regenera no descanso, não no esforço.'},

  {id:'sab',short:'Sáb',label:'Sábado',sub:'Bici ou Surf',color:'#f4a261',
   chips:["8' ativação","60' bici/surf","10' retorno"],
   blocks:[
    {label:'Ativação (sempre fazer)',time:'8 min',exs:[
      e('Shoulder CARs','10 rep lentas · 4 min','Rotações articulares controladas. Nunca entres na água sem isto.',false,'Shoulder_CARs'),
      e('Hip opener standing','30 seg cada lado · 3 min','Joelho sobe e rota para fora. Prepara stance e anca.',false,'90_90_hip_switch'),
      e('Ankle circles','1 min','10 círculos cada direção.',false,'Ankle_circles_calf_stretch'),
    ]},
    {label:'Opção A — Bici zona 2',time:'60 min',exs:[
      e('Pedalada zona 2','50-60 min','Consegues falar frases completas. Base aeróbica do surf.',false,'Bicicleta_zona_2'),
    ]},
    {label:'Opção B — Surf',time:'variável',exs:[
      e('Remada — foco na técnica','no mar','Rema do COTOVELO para a anca, não da mão. Remadas longas > remadas rápidas.',false,'TRX_inverted_row'),
      e('Pop-up — aplica o padrão','no mar','Mãos ao lado do peito, um movimento fluido.',false,'Pop_up_burpee'),
    ]},
    {label:'Retorno à calma',time:'10 min',exs:[
      e('Hip flexor stretch','60 seg cada · 4 min','Pós-bici ou pós-surf — anca fecha nos dois.',false,'Dragon_pose'),
      e('Foam roller torácica T3-T10','3 min','Rola lento. Pausa 30 seg nos pontos tensos.',false,'Foam_roller_thoracic'),
      e('Supine twist','90 seg cada lado','Fecha com rotação — sempre.',true,'Supine_spinal_twist'),
    ]},
   ],
   tip:'No lineup: rema do cotovelo para a anca — ativa grande dorsal e faz a remada viajar muito mais longe.'},

  {id:'dom',short:'Dom',label:'Domingo',sub:'Descanso ativo',color:'#6b7a8d',
   chips:["30' movimento","10' foam","5' respiração"],
   blocks:[
    {label:'Se surfaste sábado',time:'20-30 min',exs:[
      e('Caminhada suave','20-30 min','Circulação sem carga. Recuperação ativa.',false,null),
      e('Foam roller corpo todo','10 min','Costas, glúteos, IT band, panturrilhas. Lento.',false,'Foam_roller_thoracic'),
      e('Respiração diafragmática','5 min','Mão na barriga. Inspira 4 seg nariz, expira 6-8 seg boca.',true,'Respiracao_diafragmatica'),
    ]},
    {label:'Se não surfaste no fim de semana',time:'variável',exs:[
      e('Pré-surf: shoulder CARs','10 rep · 3 min','Nunca entres na água sem aquecer os ombros.',false,'Shoulder_CARs'),
      e('Surf — remada e pop-up','no mar','O mar é o melhor treino de remada que existe.',false,'Pop_up_burpee'),
      e('Pós-surf: supine twist','2 min cada lado','Descomprime o assimétrico do surf.',true,'Supine_spinal_twist'),
      e('Legs up the wall','5 min','Recuperação pós-surf.',false,'Legs_up_the_wall'),
    ]},
   ],
   tip:'A respiração diafragmática protege L4-L5. Vale 5 minutos qualquer dia da semana.'},
];

const checked={};
const tabs=document.getElementById('dayTabs');
const allSess=document.getElementById('allSessions');
const todayMap={1:0,2:1,3:2,4:3,5:4,6:5,0:6};
const todayIdx=todayMap[new Date().getDay()]??0;

DAYS.forEach((d,di)=>{
  checked[d.id]={};
  const tb=document.createElement('button');
  tb.className='dt'+(di===todayIdx?' today':'');
  if(di===todayIdx)tb.classList.add('on');
  tb.textContent=d.short;
  tb.onclick=()=>{
    document.querySelectorAll('.dt').forEach(b=>b.classList.remove('on'));
    tb.classList.add('on');
    document.querySelectorAll('.sess').forEach(s=>s.classList.remove('vis'));
    document.getElementById('s-'+d.id).classList.add('vis');
  };
  tabs.appendChild(tb);

  let totalEx=0;
  d.blocks.forEach(b=>totalEx+=b.exs.length);

  const sess=document.createElement('div');
  sess.className='sess'+(di===todayIdx?' vis':'');
  sess.id='s-'+d.id;

  let html=`
    <div class="s-hero" style="background:${d.color}">
      <div class="s-day-tag">${d.label}</div>
      <div class="s-title">${d.sub}</div>
      <div class="s-chips">${d.chips.map(c=>`<span class="s-chip">${c}</span>`).join('')}<span class="s-chip" id="prog-lbl-${d.id}">0/${totalEx} feitos</span></div>
    </div>
    <div class="prog-wrap">
      <div class="prog-label" id="prog-pct-${d.id}">0%</div>
      <div class="prog-bar"><div class="prog-fill" id="prog-${d.id}" style="background:${d.color}"></div></div>
    </div>`;

  d.blocks.forEach(b=>{
    html+=`<div class="block"><div class="block-hd">${b.label}<span class="block-time">${b.time}</span></div>`;
    b.exs.forEach((ex,ei)=>{
      const xid=`${d.id}_b${b.label.replace(/\W+/g,'')}_${ei}`;
      const imgHtml=ex.img&&IMGS[ex.img]
        ?`<img src="${IMGS[ex.img]}" alt="${ex.name}" loading="lazy">`
        :`<div style="width:100%;height:80px;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:11px;">sem img</div>`;
      html+=`<div class="ex-card" id="card-${xid}">
        <div class="ex-inner">
          <div class="ex-img">${imgHtml}</div>
          <div class="ex-info">
            <div class="ex-name">${ex.name}</div>
            <div class="ex-sets">${ex.sets}</div>
            <div class="ex-cue">${ex.cue}</div>
            ${ex.safe?'<div class="ex-safe">L4-L5 safe</div>':''}
          </div>
          <div class="ex-check" onclick="tick('${d.id}','${xid}',${totalEx},'${d.color}')" aria-label="Marcar como feito">
            <div class="chk" id="chk-${xid}">
              <svg width="12" height="12" viewBox="0 0 12 12"><polyline points="1.5,6 4.5,9 10.5,2" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </div>
        </div>
      </div>`;
    });
    html+=`</div>`;
  });

  html+=`<div class="tip"><strong>Dica surf</strong>${d.tip}</div>`;
  html+=`<div class="done-banner" id="done-${d.id}"><p>Sessão completa!</p><span>Excelente trabalho hoje</span></div>`;
  sess.innerHTML=html;
  allSess.appendChild(sess);
});

function tick(dayId,xid,total,color){
  checked[dayId]=checked[dayId]||{};
  checked[dayId][xid]=!checked[dayId][xid];
  const chk=document.getElementById('chk-'+xid);
  const card=document.getElementById('card-'+xid);
  chk.classList.toggle('on',!!checked[dayId][xid]);
  card.classList.toggle('done-card',!!checked[dayId][xid]);
  const done=Object.values(checked[dayId]).filter(Boolean).length;
  const pct=Math.round(done/total*100);
  document.getElementById('prog-'+dayId).style.width=pct+'%';
  document.getElementById('prog-lbl-'+dayId).textContent=done+'/'+total+' feitos';
  document.getElementById('prog-pct-'+dayId).textContent=pct+'%';
  document.getElementById('done-'+dayId).classList.toggle('show',done===total);
}
</script>
</body>
</html>
